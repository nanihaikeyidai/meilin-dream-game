name: Publish Release (manual)

# 本地已 build 完成后，手动触发此 workflow 将 dist/*.exe 发布到 GitHub Releases。
# 也可在 runner 上现场 build（与 tag 流程相同，但不依赖 tag）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install

      - name: Prepare winCodeSign cache
        shell: pwsh
        run: ./scripts/prepare-wincodesign-cache.ps1

      - name: Build Windows portable
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --x64

      - name: Build Windows installer
        continue-on-error: true
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: AVG梦工厂 ${{ inputs.tag }}
          files: |
            dist/*.exe
            dist/*.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: false
