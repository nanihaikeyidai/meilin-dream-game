<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>月下长安 — AI Visual Novel</title>
  <style>
    /* ===== Reset & Base ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; background: #000; color: #fff; user-select: none; }

    /* ===== 开始画面（覆盖层） ===== */
    #startOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      animation: fadeIn 0.8s ease-out; color: #fff;
    }
    #startOverlay .inner { text-align: center; max-width: 420px; padding: 20px; animation: fadeInUp 1s ease-out; position: relative; z-index: 2; }
    #startOverlay .sub { font-size: 13px; letter-spacing: 6px; color: rgba(200,190,255,.6); margin-bottom: 12px; }

    /* 开始画面装饰 - 灯笼 */
    .lantern { position: absolute; width: 24px; z-index: 1; opacity: 0.35; animation: lanternSway 3s ease-in-out infinite; }
    .lantern::before { content: '🏮'; font-size: 24px; filter: drop-shadow(0 0 8px rgba(255,200,100,.3)); }
    .lantern.l1 { top: 6%; left: 12%; animation-delay: 0s; }
    .lantern.l2 { top: 8%; right: 15%; animation-delay: 0.8s; }
    .lantern.l3 { top: 4%; left: 50%; margin-left: -12px; animation-delay: 1.6s; transform: scale(0.8); }
    @keyframes lanternSway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    /* 开始画面装饰 - 粒子 */
    .particle { position: absolute; width: 4px; height: 4px; background: rgba(200,180,255,.3); border-radius: 50%; z-index: 1; animation: particleFloat 4s ease-in-out infinite; }
    .particle.p1 { top: 20%; left: 25%; animation-delay: 0s; }
    .particle.p2 { top: 35%; right: 20%; animation-delay: 1.2s; width: 3px; height: 3px; }
    .particle.p3 { top: 50%; left: 15%; animation-delay: 2.4s; }
    .particle.p4 { top: 60%; right: 30%; animation-delay: 0.6s; width: 5px; height: 5px; }
    .particle.p5 { top: 75%; left: 35%; animation-delay: 3s; }
    .particle.p6 { top: 15%; left: 60%; animation-delay: 1s; }
    .particle.p7 { top: 45%; right: 10%; animation-delay: 2s; width: 3px; height: 3px; }
    .particle.p8 { top: 80%; left: 55%; animation-delay: 1.8s; }
    @keyframes particleFloat { 0%,100% { transform: translateY(0) scale(1); opacity: 0.3; } 50% { transform: translateY(-20px) scale(1.3); opacity: 0.6; } }
    /* 开始画面装饰 - 古风花纹 */
    .pattern-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(180,160,255,.04) 0%, transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(180,160,255,.03) 0%, transparent 20%),
        radial-gradient(circle at 40% 70%, rgba(180,160,255,.04) 0%, transparent 25%),
        radial-gradient(circle at 70% 80%, rgba(180,160,255,.03) 0%, transparent 20%),
        radial-gradient(circle at 10% 60%, rgba(180,160,255,.03) 0%, transparent 15%),
        radial-gradient(circle at 90% 60%, rgba(180,160,255,.03) 0%, transparent 15%);
      z-index: 1; pointer-events: none;
    }
    #startOverlay .title {
      font-size: 44px; font-weight: 700; letter-spacing: 12px;
      background: linear-gradient(135deg,#e8d5ff,#8ec5fc,#e0c3fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    #startOverlay .desc { font-size: 12px; color: rgba(255,255,255,.4); letter-spacing: 3px; margin-bottom: 30px; line-height: 1.8; }
    #startOverlay label { display: block; font-size: 11px; color: rgba(200,180,255,.5); letter-spacing: 2px; margin-bottom: 6px; text-align: left; }
    #startOverlay input {
      width: 100%; padding: 10px 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15);
      border-radius: 6px; color: #fff; font-size: 15px; font-family: inherit; letter-spacing: 2px;
      outline: none; text-align: center; margin-bottom: 16px;
    }
    #startOverlay input:focus { border-color: rgba(200,180,255,.4); }
    .personality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; }
    .pers-opt {
      padding: 10px 8px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px; cursor: pointer; text-align: center; transition: all .2s;
      font-size: 13px; letter-spacing: 1px; color: rgba(255,255,255,.7);
    }
    .pers-opt:hover { background: rgba(255,255,255,.1); border-color: rgba(200,180,255,.3); }
    .pers-opt.selected { background: rgba(200,180,255,.12); border-color: rgba(200,180,255,.5); }
    .pers-opt .emoji { font-size: 18px; display: block; margin-bottom: 2px; }
    .btn-start {
      width: 100%; padding: 12px 0; background: rgba(200,180,255,.15); border: 1px solid rgba(200,180,255,.3);
      border-radius: 6px; color: #fff; font-size: 15px; letter-spacing: 6px; cursor: pointer;
      font-family: inherit; transition: all .3s;
    }
    .btn-start:hover { background: rgba(200,180,255,.25); }

    /* ===== 游戏主界面 ===== */
    #gameScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: none; /* shown after startGame */
    }

    /* 背景层 */
    .bg-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
    }
    #bgImage {
      width: 100%; height: 100%; object-fit: cover;
      transition: opacity 1.2s ease;
    }
    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    /* 人物立绘层 - 响应式 */
    .character-layer {
      position: absolute; left: 50%; transform: translateX(-50%);
      z-index: 2; pointer-events: none;
      bottom: 28%;
    }
    #spriteImage {
      max-height: 62vh; width: auto;
      object-fit: contain;
      opacity: 0; transition: opacity 0.8s ease;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.4));
    }
    @media (max-height: 600px) {
      .character-layer { bottom: 12%; }
      #spriteImage { max-height: 45vh; }
    }
    @media (orientation: portrait) and (max-width: 480px) {
      .character-layer { bottom: 42%; }
      #spriteImage { max-height: 38vh; }
    }
    @media (min-height: 900px) {
      .character-layer { bottom: 32%; }
      #spriteImage { max-height: 68vh; }
    }
    #spriteImage.visible { opacity: 1; }
    /* 立绘入场动画 */
    #spriteImage.slide-in-left { animation: spriteSlideInLeft 0.6s ease-out both; }
    #spriteImage.slide-in-right { animation: spriteSlideInRight 0.6s ease-out both; }
    @keyframes spriteSlideInLeft { from { opacity:0; transform:translateX(-40px); } to { opacity:1; transform:translateX(0); } }
    @keyframes spriteSlideInRight { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }

    /* 文本框 - 底部覆盖 */
    .text-layer {
      position: absolute; bottom: 0; left: 0; width: 100%;
      z-index: 5; pointer-events: none;
    }
    .text-window {
      position: relative; margin: 0 auto; max-width: 860px;
      padding: 18px 28px 28px; pointer-events: auto;
    }
    .choices-in-window {
      position: absolute; left: 0; right: 0; bottom: 100%;
      margin-bottom: 6px; z-index: 6;
      max-height: 28vh; overflow-y: auto;
      display: none; flex-direction: column; gap: 4px;
      pointer-events: auto;
    }
    .choices-in-window.visible { display: flex; }
    .text-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.88) 100%);
      border-radius: 12px 12px 0 0; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.06);
      border-bottom: none;
    }
    .text-inner { position: relative; z-index: 1; }
    .text-name {
      font-size: 15px; font-weight: 600; letter-spacing: 2px;
      color: #c8b4ff; margin-bottom: 6px; display: none;
    }
    .text-name.visible { display: block; }
    .text-body {
      font-size: 15px; line-height: 1.8; color: rgba(255,255,255,.88);
      min-height: 4.2em; max-height: 8em; overflow: hidden;
      position: relative;
    }
    .text-body p { margin-bottom: 0.4em; }
    .text-body .scene-title {
      font-size: 13px; color: rgba(200,180,255,.6); letter-spacing: 3px;
      margin-bottom: 8px; display: block;
    }
    .text-next {
      text-align: right; font-size: 12px; color: rgba(200,180,255,.4);
      letter-spacing: 2px; margin-top: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }

    /* 点击翻页区域 */
    .click-area {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3; cursor: pointer;
    }

    /* 选项（文本框上方，紧凑） */
    .choices-overlay {
      display: none;
    }
    .choice-btn {
      background: rgba(30,30,46,0.92); border: 1px solid rgba(255,255,255,.12);
      border-radius: 6px; color: #d4d4ea; padding: 8px 12px;
      text-align: left; cursor: pointer; font-size: 13px;
      font-family: inherit; line-height: 1.4; transition: all 0.2s;
      backdrop-filter: blur(6px);
    }
    .choice-btn:hover { border-color: #6c5ce7; background: rgba(108,92,231,0.2); transform: translateX(4px); }
    .choice-hint { display: block; font-size: 11px; color: rgba(200,180,255,.4); margin-top: 2px; letter-spacing: 1px; }

    /* 加载状态 */
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
    }
    .loading-overlay.visible { display: flex; }
    .loading-spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.1);
      border-top-color: #c8b4ff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: rgba(200,180,255,.6); letter-spacing: 2px; }

    /* 对话框内等待省略号 */
    .typing-wait { color: rgba(200,180,255,.5); font-style: italic; }
    .typing-dots span {
      animation: typingDot 1.2s infinite;
      opacity: 0.3;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot {
      0%, 60%, 100% { opacity: 0.25; }
      30% { opacity: 1; }
    }

    .tts-indicator[data-offline="1"] { opacity: 0.35; }

    /* 错误 */
    .error-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    }
    .error-overlay.visible { display: flex; }
    .error-box {
      background: rgba(42,26,26,0.9); border: 1px solid #f87171; padding: 16px 24px;
      border-radius: 8px; color: #fca5a5; font-size: 13px; max-width: 400px; text-align: center; line-height: 1.6;
    }
    .btn-retry {
      background: rgba(200,180,255,.15); border: 1px solid rgba(200,180,255,.3);
      border-radius: 6px; color: #fff; padding: 10px 28px; cursor: pointer;
      font-size: 13px; letter-spacing: 3px; font-family: inherit;
    }
    .btn-retry:hover { background: rgba(200,180,255,.25); }

    /* ===== 内嵌自定义输入区 ===== */
    .custom-input-inline {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.08);
      animation: fadeInUp 0.25s ease-out;
    }
    .custom-input-inline.visible { display: block; }
    .cii-row { display: flex; gap: 8px; align-items: flex-end; }
    .cii-input {
      flex: 1; background: rgba(255,255,255,.06); border: 1px solid rgba(200,180,255,.2);
      border-radius: 8px; color: #fff; font-size: 14px; font-family: inherit;
      padding: 10px 14px; outline: none; resize: none; min-height: 44px; max-height: 100px;
      line-height: 1.6;
    }
    .cii-input:focus { border-color: rgba(200,180,255,.5); }
    .cii-send {
      background: rgba(200,180,255,.15); border: 1px solid rgba(200,180,255,.3);
      border-radius: 8px; color: #fff; padding: 10px 20px; cursor: pointer;
      font-size: 13px; letter-spacing: 2px; font-family: inherit;
      white-space: nowrap; transition: all .2s;
    }
    .cii-send:hover { background: rgba(200,180,255,.25); }
    .cii-cancel {
      background: transparent; border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; color: rgba(255,255,255,.4); padding: 10px 14px; cursor: pointer;
      font-size: 12px; font-family: inherit; transition: all .2s;
    }
    .cii-cancel:hover { color: rgba(255,255,255,.6); border-color: rgba(255,255,255,.2); }

    /* ===== 顶部菜单 ===== */
    #menuBtn {
      position: fixed; top: 14px; left: 16px; z-index: 15;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,.08);
      border-radius: 6px; width: 36px; height: 36px;
      color: rgba(255,255,255,.4); cursor: pointer; font-size: 18px;
      display: none; align-items: center; justify-content: center;
      transition: all .2s; backdrop-filter: blur(4px);
    }
    #menuBtn:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); }
    #menuBtn.visible { display: flex; }
    #menuPanel {
      position: fixed; top: 56px; left: 16px; z-index: 15;
      background: rgba(20,18,40,0.95); border: 1px solid rgba(200,180,255,.15);
      border-radius: 10px; backdrop-filter: blur(12px);
      display: none; flex-direction: column; min-width: 160px;
      animation: menuFadeIn 0.2s ease-out;
    }
    #menuPanel.visible { display: flex; }
    @keyframes menuFadeIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .menu-item {
      background: none; border: none; color: rgba(255,255,255,.7);
      font-size: 13px; font-family: inherit; letter-spacing: 1px;
      padding: 10px 18px; cursor: pointer; text-align: left;
      transition: all .15s; border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: rgba(200,180,255,.08); color: #fff; }
    .menu-item .menu-icon { margin-right: 8px; opacity: .5; }

    /* ===== 设置齿轮菜单（右上角） ===== */
    #settingsBtn {
      position: fixed; top: 14px; right: 16px; z-index: 15;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,.08);
      border-radius: 6px; width: 36px; height: 36px;
      color: rgba(255,255,255,.4); cursor: pointer; font-size: 18px;
      display: none; align-items: center; justify-content: center;
      transition: all .2s; backdrop-filter: blur(4px);
    }
    #settingsBtn:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); }
    #settingsBtn.visible { display: flex; }
    #settingsPanel {
      position: fixed; top: 56px; right: 16px; z-index: 15;
      background: rgba(20,18,40,0.95); border: 1px solid rgba(200,180,255,.15);
      border-radius: 10px; backdrop-filter: blur(12px);
      display: none; flex-direction: column; min-width: 140px;
      animation: menuFadeIn 0.2s ease-out;
    }
    #settingsPanel.visible { display: flex; }

    /* ===== 选项入场动画 ===== */
    @keyframes choiceSlideIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .choice-btn {
      animation: choiceSlideIn 0.35s ease-out both;
    }

    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

    /* ===== TTS 状态指示器 ===== */
    .tts-indicator {
      position: fixed; bottom: 120px; right: 20px; z-index: 100;
      font-size: 18px; color: rgba(200,180,255,.5);
      opacity: 0; transition: opacity .3s; pointer-events: none;
      display: none;
    }
    .tts-indicator.active {
      opacity: 1; display: block;
      animation: ttsPulse 1.5s ease-in-out infinite;
    }
    @keyframes ttsPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    /* 自定义确认框 */
    #confirmOverlay {
      z-index: 10001;
    }
    #confirmOverlay .confirm-box {
      background: rgba(30, 28, 50, 0.95);
      border: 1px solid rgba(200, 180, 255, 0.35);
      border-radius: 10px;
      padding: 24px 28px;
      max-width: 360px;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      line-height: 1.7;
    }
    #confirmOverlay .confirm-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 18px;
    }
    #confirmOverlay .btn-confirm {
      padding: 8px 22px;
      border-radius: 6px;
      border: 1px solid rgba(200, 180, 255, 0.4);
      background: rgba(200, 180, 255, 0.15);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }
    #confirmOverlay .btn-confirm.primary {
      background: rgba(108, 92, 231, 0.35);
    }
  </style>
</head>
<body>

<!-- ===== 开始画面 ===== -->
<div id="startOverlay">
    <div class="lantern l1"></div><div class="lantern l2"></div><div class="lantern l3"></div>
    <div class="particle p1"></div><div class="particle p2"></div><div class="particle p3"></div><div class="particle p4"></div><div class="particle p5"></div><div class="particle p6"></div><div class="particle p7"></div><div class="particle p8"></div>
    <div class="pattern-overlay"></div>
    <div class="inner">
    <div id="startSub" class="sub">—— 古风奇幻 · AI Visual Novel ——</div>
    <div id="startTitle" class="title">月下长安</div>
    <div id="startDesc" class="desc">上元灯夜 · 长安满城花灯如昼<br>一块玉佩 · 六个各怀心事的人 · 一段横跨十年的旧案</div>
    <label>你的名字</label>
    <input type="text" id="playerName" value="陈远" maxlength="8">
    <label>你的性格底色</label>
    <div class="personality-grid">
      <div class="pers-opt" data-val="silent" onclick="selectPers(this)"><span class="emoji">🧊</span>沉默寡言</div>
      <div class="pers-opt" data-val="cheerful" onclick="selectPers(this)"><span class="emoji">☀️</span>活泼开朗</div>
      <div class="pers-opt selected" data-val="gentle" onclick="selectPers(this)"><span class="emoji">🌙</span>温柔体贴</div>
      <div class="pers-opt" data-val="tsundere" onclick="selectPers(this)"><span class="emoji">🔥</span>傲娇毒舌</div>
    </div>
    <button class="btn-start" onclick="startGame()">开始故事 →</button>
  </div>
</div>

<!-- ===== 游戏主界面 ===== -->
<div id="gameScreen">
  <!-- 背景 -->
  <div class="bg-layer">
    <img id="bgImage" src="assets/backgrounds/classroom_afternoon.png" alt="背景">
    <div class="bg-overlay"></div>
  </div>

  <!-- 人物立绘 -->
  <div class="character-layer">
    <img id="spriteImage" src="" alt="立绘">
  </div>

  <!-- 点击翻页区域 -->
  <div class="click-area" id="clickArea" onclick="advancePage()"></div>

  <!-- 文本框 -->
  <div class="text-layer">
    <div class="text-window">
      <div class="choices-in-window choices-overlay" id="choicesOverlay"></div>
      <div class="text-bg"></div>
      <div class="text-inner">
        <div class="text-name" id="textName"></div>
        <div class="text-body" id="textBody"><p style="color:rgba(200,180,255,.4)">故事即将开始…</p></div>
        <div class="text-next" id="textNext">▼ 点击继续</div>
        <div class="custom-input-inline" id="customInputInline">
          <div class="cii-row">
            <textarea class="cii-input" id="cipText" rows="1" placeholder="说点什么…"></textarea>
            <button class="cii-send" onclick="sendCustomInput()">发送</button>
            <button class="cii-cancel" onclick="closeCustomInput()">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- 加载中 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">故事正在展开…</div>
  </div>

  <!-- 错误 -->
  <div class="error-overlay" id="errorOverlay">
    <div class="error-box" id="errorText">连接失败</div>
    <button class="btn-retry" onclick="retryGame()">重新加载</button>
  </div>

  <!-- 菜单按钮 + 面板 -->
  <button id="menuBtn" onclick="toggleMenu()">☰</button>
  <div id="menuPanel">
    <button class="menu-item" onclick="saveProgress()"><span class="menu-icon">💾</span>保存进度</button>
    <button class="menu-item" onclick="loadProgress()"><span class="menu-icon">📂</span>加载进度</button>
    <button class="menu-item" onclick="backToTitle()"><span class="menu-icon">⊞</span>返回标题</button>
    <button class="menu-item" onclick="restartGame()"><span class="menu-icon">↻</span>重新开始</button>
    <button class="menu-item" onclick="showAbout()"><span class="menu-icon">i</span>关于</button>
  </div>

  <!-- 设置齿轮按钮 + 面板 -->
  <button id="settingsBtn" onclick="toggleSettings()">⚙</button>
  <div id="settingsPanel">
    <button class="menu-item" onclick="restartGame()"><span class="menu-icon">↻</span>重新开始</button>
    <button class="menu-item" onclick="showAbout()"><span class="menu-icon">i</span>关于</button>
  </div>

  <!-- TTS 语音播放器 -->
  <audio id="ttsPlayer" preload="auto" style="display:none"></audio>
  <!-- TTS 状态指示器 -->
  <div id="ttsIndicator" class="tts-indicator">♪</div>
</div>

<!-- 自定义确认框 -->
<div class="error-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div id="confirmMessage"></div>
    <div class="confirm-actions">
      <button type="button" class="btn-confirm" id="confirmCancel">取消</button>
      <button type="button" class="btn-confirm primary" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/api.js"></script>
<script src="js/stream.js"></script>
<script src="js/tts.js"></script>
<script src="js/save.js"></script>
<script src="js/bootstrap.js"></script>
</body>
</html>
