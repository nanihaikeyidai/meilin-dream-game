<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夏日的回音 — AI AVG</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== 游戏主布局 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
    body { background: #0f0c29; color: #d4d4ea; }
    .game-layout {
      display: grid;
      grid-template-columns: 240px 1fr 220px;
      grid-template-rows: 1fr auto;
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px;
      height: 100vh;
    }

    /* 立绘面板（左侧） */
    .portrait-panel {
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 20px;
    }
    .portrait-frame {
      width: 200px;
      height: 350px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .portrait-img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .portrait-placeholder { text-align: center; color: rgba(255,255,255,.2); }
    .placeholder-icon { font-size: 48px; margin-bottom: 8px; }
    .placeholder-text { font-size: 13px; letter-spacing: 2px; }
    .portrait-name { font-size: 18px; font-weight: 600; margin: 10px 0 4px; letter-spacing: 3px; }
    .portrait-expression { font-size: 12px; color: rgba(200,180,255,.5); letter-spacing: 2px; }
    .portrait-fade { display: none; }

    /* 叙事区（中间） */
    .game-narrative {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 10px;
      padding: 20px;
    }
    .narrative-header { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .narrative-header h2 { color: #fff; font-size: 1.2em; }
    .chapter-tag { background: #6c5ce7; padding: 2px 10px; border-radius: 4px; font-size: 0.8em; color: #fff; }
    .narrative-content {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
      line-height: 1.8;
      font-size: 14px;
    }
    .narrative-content p { margin-bottom: 0.6em; color: #d4d4ea; }
    .narrative-fade { display: none; }

    /* 选项区（中间下方） */
    .game-choices {
      grid-column: 2;
      grid-row: 2;
      padding-top: 4px;
    }
    .choices-header { font-size: 12px; color: rgba(200,180,255,.5); letter-spacing: 3px; margin-bottom: 8px; }
    .choices-list { display: flex; flex-direction: column; gap: 6px; }
    .choices-custom { display: flex; gap: 8px; margin-top: 10px; }

    /* 状态面板（右侧） */
    .game-status {
      grid-column: 3;
      grid-row: 1 / 3;
      overflow-y: auto;
    }
    .status-panel { display: flex; flex-direction: column; gap: 14px; }
    .status-section { background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06); border-radius: 10px; padding: 14px; }
    .status-section h4 { font-size: 11px; color: rgba(200,180,255,.5); letter-spacing: 3px; margin-bottom: 10px; }
    .status-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .status-label { color: rgba(255,255,255,.35); }
    .status-value { color: #d4d4ea; }
    .status-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
    .status-bar-label { width: 32px; color: rgba(255,255,255,.35); }
    .status-bar-track { flex: 1; height: 6px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; }
    .status-bar-fill { height: 100%; background: #6c5ce7; border-radius: 3px; transition: width .5s; }
    .status-bar-fill-warn { background: #f59e0b; }
    .status-bar-fill-love { background: #ec4899; }
    .status-bar-value { width: 28px; text-align: right; color: rgba(255,255,255,.5); }
    .log-list { max-height: 140px; overflow-y: auto; font-size: 11px; }
    .log-item { padding: 3px 0; color: rgba(255,255,255,.4); border-bottom: 1px solid rgba(255,255,255,.03); }

    /* 按钮 */
    .choice-btn {
      background: #1e1e2e; border: 1px solid #3d3d5c; color: #d4d4ea;
      padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%;
      text-align: left; transition: all 0.2s; font-size: 13px;
    }
    .choice-btn:hover { border-color: #6c5ce7; background: #2a2a3e; }
    .choice-text { display: block; }
    .choice-hint { font-size: 0.8em; color: #7b7ba8; margin-top: 2px; }
    .choice-placeholder { color: #7b7ba8; text-align: center; padding: 20px; font-size: 13px; }
    .btn-primary { background: #6c5ce7; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-primary:hover { background: #7c6cf7; }
    .custom-input {
      flex: 1; background: #1e1e2e; border: 1px solid #3d3d5c; color: #d4d4ea;
      padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; font-family: inherit;
    }
    .custom-input:focus { border-color: #6c5ce7; }

    /* 加载动画 */
    .loading-dot { animation: blink 1s infinite; }
    .loading-dot:nth-child(2) { animation-delay: 0.3s; }
    .loading-dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* 错误 */
    .error-box { background: #2a1a1a; border: 1px solid #f87171; padding: 16px; border-radius: 8px; margin: 10px 0; color: #fca5a5; font-size: 13px; }
    .retry-btn { background: #6c5ce7; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .retry-btn:hover { background: #7c6cf7; }

    /* 响应式 */
    @media (max-width: 900px) {
      .game-layout { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; min-height: 100vh; }
      .portrait-panel { grid-row: auto; }
      .game-narrative { grid-column: 1; min-height: 300px; }
      .game-choices { grid-column: 1; }
      .game-status { grid-column: 1; }
    }
  </style>
</head>
<body>
  <!-- ============ 开始画面（覆盖层） ============ -->
  <div id="startOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;flex-direction:column;animation:fadeIn 0.8s ease-out;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#fff;">
    <div style="text-align:center;max-width:480px;padding:20px;animation:fadeInUp 1s ease-out;">
      <div style="font-size:14px;letter-spacing:6px;color:rgba(200,190,255,.6);margin-bottom:16px;">—— AI AVG ——</div>
      <div style="font-size:48px;font-weight:700;letter-spacing:12px;background:linear-gradient(135deg,#e8d5ff,#8ec5fc,#e0c3fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;">夏日的回音</div>
      <div style="font-size:13px;color:rgba(255,255,255,.4);letter-spacing:3px;margin-bottom:36px;line-height:1.8;">高三毕业的夏天 · 一场没人说出口的约定</div>
      <div style="margin-bottom:24px;text-align:left;">
        <div style="font-size:12px;color:rgba(200,180,255,.5);letter-spacing:2px;margin-bottom:8px;">你的名字</div>
        <input type="text" id="playerName" value="陈远" maxlength="8" style="width:100%;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:16px;font-family:inherit;letter-spacing:2px;outline:none;text-align:center;">
      </div>
      <div style="margin-bottom:24px;">
        <div style="font-size:12px;color:rgba(200,180,255,.5);letter-spacing:2px;margin-bottom:10px;">你的性格底色</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div class="start-opt" data-val="silent" onclick="selectStartAttr(this)" style="padding:14px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;text-align:center;transition:all .2s;font-size:14px;letter-spacing:2px;">
            <div style="font-size:20px;margin-bottom:4px;">🧊</div>沉默寡言
          </div>
          <div class="start-opt" data-val="cheerful" onclick="selectStartAttr(this)" style="padding:14px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;text-align:center;transition:all .2s;font-size:14px;letter-spacing:2px;">
            <div style="font-size:20px;margin-bottom:4px;">☀️</div>活泼开朗
          </div>
          <div class="start-opt selected" data-val="gentle" onclick="selectStartAttr(this)" style="padding:14px 12px;background:rgba(200,180,255,.1);border:1px solid rgba(200,180,255,.4);border-radius:8px;cursor:pointer;text-align:center;transition:all .2s;font-size:14px;letter-spacing:2px;">
            <div style="font-size:20px;margin-bottom:4px;">🌙</div>温柔体贴
          </div>
          <div class="start-opt" data-val="tsundere" onclick="selectStartAttr(this)" style="padding:14px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;text-align:center;transition:all .2s;font-size:14px;letter-spacing:2px;">
            <div style="font-size:20px;margin-bottom:4px;">🔥</div>傲娇毒舌
          </div>
        </div>
      </div>
      <button onclick="startGame()" style="width:100%;padding:14px 0;background:rgba(200,180,255,.15);border:1px solid rgba(200,180,255,.3);border-radius:8px;color:#fff;font-size:16px;letter-spacing:6px;cursor:pointer;font-family:inherit;transition:all .3s;">
        开始故事 →
      </button>
    </div>
  </div>
  <style>
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .start-opt:hover { background:rgba(255,255,255,.1)!important; border-color:rgba(200,180,255,.3)!important; }
    .start-opt.selected { background:rgba(200,180,255,.1)!important; border-color:rgba(200,180,255,.5)!important; }
    #playerName:focus { border-color:rgba(200,180,255,.4); }
  </style>

  <div class="game-layout">
    <!-- ============ 立绘面板 ============ -->
    <div class="portrait-panel" id="portraitPanel" style="display:none;">
      <div class="portrait-frame" id="portraitFrame">
        <img id="portraitImage" class="portrait-img" src="" alt="角色立绘" style="display:none;">
        <div class="portrait-placeholder" id="portraitPlaceholder">
          <div class="placeholder-icon">🎭</div>
          <div class="placeholder-text">等角色登场</div>
        </div>
      </div>
      <div class="portrait-name" id="portraitName">——</div>
      <div class="portrait-expression" id="portraitExpression"></div>
    </div>

    <div class="game-narrative">
      <div class="narrative-header">
        <span class="chapter-tag">第一章</span>
        <h2 id="sceneTitle">夏日的回音</h2>
      </div>
      <div class="narrative-content" id="narrativeContent">
        <p style="color:#7b7ba8">正在加载剧本…</p>
      </div>
    </div>

    <div class="game-choices">
      <div class="choices-header">
        <span>你的选择</span>
      </div>
      <div class="choices-list" id="choicesList">
        <div class="choice-placeholder">故事即将开始</div>
      </div>
      <div class="choices-custom">
        <input type="text" id="customInput" class="custom-input" placeholder="或者自己输入对话/行动…" autocomplete="off">
        <button id="sendBtn" class="btn-primary" style="padding:8px 20px;">发送</button>
      </div>
    </div>

    <div class="game-status">
      <div class="status-panel">
        <div class="status-section">
          <h4>角色</h4>
          <div class="status-item">
            <span class="status-label">名字</span>
            <span class="status-value" id="charName">你</span>
          </div>
          <div class="status-item">
            <span class="status-label">性别</span>
            <span class="status-value" id="charGender">--</span>
          </div>
        </div>
        <div class="status-section">
          <h4>状态</h4>
          <div class="status-bar">
            <span class="status-bar-label">体力</span>
            <div class="status-bar-track"><div class="status-bar-fill" id="staminaBar" style="width: 85%"></div></div>
            <span class="status-bar-value" id="staminaVal">85</span>
          </div>
          <div class="status-bar">
            <span class="status-bar-label">精神</span>
            <div class="status-bar-track"><div class="status-bar-fill status-bar-fill-warn" id="mindBar" style="width: 60%"></div></div>
            <span class="status-bar-value" id="mindVal">60</span>
          </div>
          <div class="status-bar">
            <span class="status-bar-label">好感</span>
            <div class="status-bar-track"><div class="status-bar-fill status-bar-fill-love" id="affectionBar" style="width: 15%"></div></div>
            <span class="status-value" id="affectionVal">15</span>
          </div>
        </div>
        <div class="status-section">
          <h4>剧本</h4>
          <div class="status-item">
            <span class="status-label">当前</span>
            <span class="status-value">夏日的回音</span>
          </div>
          <div class="status-item">
            <span class="status-label">回合</span>
            <span class="status-value" id="turnCount">0</span>
          </div>
        </div>
        <div class="status-section">
          <h4>记录</h4>
          <div class="log-list" id="logList">
            <div class="log-item">游戏开始</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ======================== START SCREEN ========================
    let playerAttrs = { name: '陈远', personality: 'gentle' };

    function selectStartAttr(el) {
      document.querySelectorAll('.start-opt').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      playerAttrs.personality = el.dataset.val;
    }

    function startGame() {
      const name = document.getElementById('playerName').value.trim() || '陈远';
      playerAttrs.name = name;
      document.getElementById('startOverlay').style.display = 'none';
      document.getElementById('charName').textContent = name;
      initGame();
    }

    document.getElementById('playerName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startGame();
    });

    // ======================== CONFIG ========================
    // Same-origin API proxy (runs on port 8649, forwards to Gateway :8642)
    const API_BASE_URL = '/proxy';
    const API_KEY = '';
    const MODEL = 'deepseek-v4-flash';

    // ======================== STORY DATA ========================
    const STORY_CONTENT = `# 模板 A：校园青春 · 夏日的回音（活动版）

## 类型标签
青春 / 治愈 / 悬疑 / 纯爱 / 群像

## 一句话简介
高三毕业的那个夏天，你回到了空无一人的母校——不是来告别的，是来赴一场没人说出口的约定。昔日同窗一个接一个回来了，每个人都带着秘密，每个人都有没说出口的话。校园里藏着一个高二那年被掩埋的真相，而这个夏天，所有的线头都会浮出水面。

## 世界观
现代中国，普通小城市。时间：六月底到七月中旬，高考结束后的盛夏。
地点：一所县城高中。暑假的校园空荡荡的，但操场上有人在打球，琴房里有人在弹琴，天台上有人躺着看云——这届毕业生们，用自己的方式留在这个夏天里。

## 核心悬念：「高二那件事」
高二下学期，学校里发生了一起严重的事件。你被卷入其中，差点被开除。但你对此的记忆是模糊的——医生说创伤性记忆抑制，你选择性地遗忘了一些东西。
每个人都记得。每个人都知道一部分真相。但没有人主动告诉你。

## 活动推进机制
游戏以校园活动为节奏：①返校日·重逢 → ②校园大扫除 → ③旧照片展 → ④天台夏夜会 → ⑤社团文化祭 → ⑥星空下的坦白 → ⑦夏日祭·告别`;

    const ROLE_CARDS = {
      '林雪': { id: 'linxue', desc: '温柔内敛的班长，你的三年同桌。黑长直，白裙，细框眼镜。她是整件事中距离真相最近的人。' },
      '苏云溪': { id: 'suyunxi', desc: '开朗活泼的青梅竹马。短发，运动系。一句无心的话改变了所有人的命运。' },
      '沈清辞': { id: 'shenqingci', desc: '沉默寡言的摄影少女。清瘦，刘海遮脸，总挂着相机。她的相机里藏着最后的底牌。' },
      '夏知遥': { id: 'xiazhiyao', desc: '外冷内热的学生会副会长。高马尾，校服最整洁。她用违规之手保护了你。' },
      '江晓渔': { id: 'jiangxiaoyu', desc: '元气跳脱的转学生。最像局外人的人，反而最清醒。' },
      '程念慈': { id: 'chengnianci', desc: '实习音乐老师。沉默的见证者。' },
      '叶小满': { id: 'yexiaoman', desc: '神秘学妹。追猎真相的人。' }
    };

    const PORTRAIT_CHARACTERS = {
      '林雪': 'linxue', '苏云溪': 'suyunxi', '沈清辞': 'shenqingci',
      '夏知遥': 'xiazhiyao', '江晓渔': 'jiangxiaoyu', '程念慈': 'chengnianci', '叶小满': 'yexiaoman'
    };
    const EXPRESSION_KEYWORDS = {
      '微笑': 'smile', '浅笑': 'smile', '轻笑': 'smile', '温柔': 'smile',
      '开心': 'happy', '大笑': 'happy', '笑出声': 'happy', '愉快': 'happy',
      '生气': 'angry', '愤怒': 'angry', '怒': 'angry', '冷眼': 'angry', '厉声': 'angry',
      '悲伤': 'sad', '伤心': 'sad', '哭': 'sad', '泪': 'sad', '哽咽': 'sad', '难过': 'sad',
      '惊讶': 'surprised', '震惊': 'surprised', '愣': 'surprised', '怔': 'surprised', '难以置信': 'surprised',
      '脸红': 'blush', '害羞': 'blush', '羞涩': 'blush', '心动': 'blush',
      '冷漠': 'cold', '冷淡': 'cold', '面无表情': 'cold', '冰冷': 'cold', '疏离': 'cold',
    };

    // ======================== STATE ========================
    const messages = [];
    let turnCount = 0;
    let currentChar = null;
    let portraitExpression = 'default';

    // ======================== DOM ========================
    const narrativeContent = document.getElementById('narrativeContent');
    const choicesList = document.getElementById('choicesList');
    const logList = document.getElementById('logList');
    const customInput = document.getElementById('customInput');
    const sendBtn = document.getElementById('sendBtn');
    const turnEl = document.getElementById('turnCount');
    const portraitImage = document.getElementById('portraitImage');
    const portraitPlaceholder = document.getElementById('portraitPlaceholder');
    const portraitName = document.getElementById('portraitName');
    const portraitExpr = document.getElementById('portraitExpression');

    // ======================== HELPERS ========================
    function addLog(text) {
      const entry = document.createElement('div');
      entry.className = 'log-item';
      entry.textContent = text.length > 60 ? text.slice(0, 60) + '…' : text;
      logList.appendChild(entry);
      logList.scrollTop = logList.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function detectCharacter(text) {
      for (const [name, id] of Object.entries(PORTRAIT_CHARACTERS)) {
        if (text.includes(name)) return { id, name };
      }
      return null;
    }

    function detectExpression(text) {
      for (const [keyword, exp] of Object.entries(EXPRESSION_KEYWORDS)) {
        if (text.includes(keyword)) return exp;
      }
      return null;
    }

    function updatePortrait(charId, expression, charName) {
      if (!charId || !charId.startsWith('linxue')) return; // only show linxue for now
      const basePath = 'assets/portraits/' + charId + '/';
      const imgPath = basePath + expression + '.png';

      portraitImage.onload = function() {
        portraitImage.style.display = 'block';
        portraitPlaceholder.style.display = 'none';
      };
      portraitImage.onerror = function() {
        if (expression !== 'default') {
          portraitImage.src = basePath + 'default.png';
          portraitImage.onerror = function() {
            portraitImage.style.display = 'none';
            portraitPlaceholder.style.display = 'flex';
          };
        } else {
          portraitImage.style.display = 'none';
          portraitPlaceholder.style.display = 'flex';
        }
      };
      portraitImage.src = imgPath;
      portraitName.textContent = charName || charId;
      currentChar = charId;
      portraitExpression = expression;
      const exprNames = { default: '平常', smile: '微笑', happy: '开心', angry: '生气', sad: '悲伤', surprised: '惊讶', blush: '羞涩', cold: '冷漠' };
      portraitExpr.textContent = exprNames[expression] || expression;
    }

    function renderResponse(text) {
      const lines = text.split('\n').filter(l => l.trim());
      const optionLines = [];
      const narrationLines = [];

      for (const line of lines) {
        const trimmed = line.trim();
        if (/^\d+[\.\】]/.test(trimmed) || /^\d+\.\s*[【「]/.test(trimmed)) {
          optionLines.push(trimmed);
        } else if (/^❤/.test(trimmed) || /^\[GALGAME STATE\]/.test(trimmed) || /^Scene:/.test(trimmed) || /^🏁/.test(trimmed) || /^Progress:/.test(trimmed) || /^Recent:/.test(trimmed)) {
          // skip state lines
        } else {
          narrationLines.push(trimmed);
        }
      }

      // Detect character + expression
      const charMatch = detectCharacter(text);
      const exprMatch = detectExpression(text);
      if (charMatch) {
        updatePortrait(charMatch.id, exprMatch || 'default', charMatch.name);
      }

      // Render narration
      narrativeContent.innerHTML = '';
      for (const line of narrationLines) {
        if (line.startsWith('###')) {
          const h = document.createElement('h3');
          h.textContent = line.replace(/^###\s*/, '');
          h.style.cssText = 'color:#fff; font-size:1.1em; margin:16px 0 8px; border-bottom:1px solid #3d3d5c; padding-bottom:4px';
          narrativeContent.appendChild(h);
        } else if (line.startsWith('>')) {
          const blockquote = document.createElement('p');
          blockquote.textContent = line.replace(/^>\s*/, '');
          blockquote.style.cssText = 'color:#b8b8d0; font-style:italic; padding:6px 12px; border-left:3px solid #6c5ce7; margin:8px 0; background:#1a1a2e';
          narrativeContent.appendChild(blockquote);
        } else {
          const p = document.createElement('p');
          p.textContent = line;
          narrativeContent.appendChild(p);
        }
      }
      narrativeContent.scrollTop = narrativeContent.scrollHeight;

      // Render choices
      choicesList.innerHTML = '';
      if (optionLines.length === 0) {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = '<span class="choice-text">继续</span><span class="choice-hint">继续推进剧情</span>';
        btn.addEventListener('click', () => sendMessage('继续'));
        choicesList.appendChild(btn);
      } else {
        for (const opt of optionLines) {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          const text = opt.replace(/^\d+[\.\】]\s*/, '').replace(/（.*）$/, '').trim();
          const hint = opt.match(/（(.+)）/);
          btn.innerHTML = '<span class="choice-text">' + escapeHtml(text) + '</span><span class="choice-hint">' + (hint ? escapeHtml(hint[1]) : '选择') + '</span>';
          btn.addEventListener('click', () => sendMessage(opt));
          choicesList.appendChild(btn);
        }
      }
    }

    // ======================== API CALL ========================
    async function callLLM(msgs) {
      const response = await fetch(API_BASE_URL + '/chat/completions', {
        method: 'POST',
        headers: Object.assign(
          { 'Content-Type': 'application/json' },
          API_KEY ? { 'Authorization': 'Bearer ' + API_KEY } : {}
        ),
        body: JSON.stringify({
          model: MODEL,
          messages: msgs,
          temperature: 0.7,
          max_tokens: 1024
        })
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error('API错误 ' + response.status + ': ' + (errText.length > 200 ? errText.slice(0, 200) : errText));
      }

      const data = await response.json();
      const content = data.choices?.[0]?.message?.content;
      if (!content) throw new Error('API返回为空');
      return content;
    }

    // ======================== SEND MESSAGE ========================
    async function sendMessage(userText) {
      messages.push({ role: 'user', content: userText });
      addLog('你：' + (userText.length > 40 ? userText.slice(0, 40) + '…' : userText));

      // Loading state
      choicesList.innerHTML = '<div class="choice-placeholder"><span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span> 故事正在展开</div>';

      turnCount++;
      turnEl.textContent = turnCount;

      try {
        const response = await callLLM(messages);
        messages.push({ role: 'assistant', content: response });
        renderResponse(response);
      } catch (e) {
        narrativeContent.innerHTML = '<div class="error-box">[出错了] ' + escapeHtml(e.message) + '</div>' + narrativeContent.innerHTML;
        choicesList.innerHTML = '<button class="choice-btn retry-btn" onclick="sendMessage(\'继续\')"><span class="choice-text">重试</span></button>';
        addLog('出错：' + e.message);
      }
    }

    // ======================== CUSTOM INPUT ========================
    sendBtn.addEventListener('click', () => {
      const text = customInput.value.trim();
      if (text) {
        customInput.value = '';
        sendMessage(text);
      }
    });
    customInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    // ======================== INIT ========================
    async function initGame() {
      // Clear previous messages (in case of re-init)
      messages.length = 0;
      turnCount = 0;
      narrativeContent.innerHTML = '<p style="color:#7b7ba8">正在加载剧本…</p>';

      // Build system prompt
      const systemPrompt = `你是 AI AVG 游戏引擎。你的角色是旁白 + 所有 NPC + 系统面板。

故事设定：
${STORY_CONTENT}

玩家角色：${playerAttrs.name}，性格：${playerAttrs.personality === 'silent' ? '沉默寡言' : playerAttrs.personality === 'cheerful' ? '活泼开朗' : playerAttrs.personality === 'gentle' ? '温柔体贴' : '傲娇毒舌'}

角色信息：
- 林雪 — 温柔内敛的班长，你的三年同桌
- 苏云溪 — 开朗活泼的青梅竹马
- 沈清辞 — 沉默寡言的摄影少女
- 夏知遥 — 外冷内热的学生会副会长
- 江晓渔 — 元气跳脱的转学生
- 程念慈 — 实习音乐老师（后期解锁）
- 叶小满 — 神秘学妹（后期解锁）

游戏规则：
1. 每次输出包含：场景叙述（用第二人称"${playerAttrs.name}"语言）+ 2-4个预设选项
2. 选项格式为：1.【选项文本】2.【选项文本】3.【选项文本】0.【自由行动】
3. 用第二人称"你"叙述，称呼玩家为${playerAttrs.name}
4. 场景标题用 ### 标记
5. 选项可以包含倾向性提示，用（温和·观察）这样的括号标注
6. 故事从「返校日·重逢」开始——${playerAttrs.name}在暑假回到母校，在走廊上遇到了林雪
7. 状态卡片格式：[GALGAME STATE] Scene: 场景ID | Act: 当前幕/总幕 ❤ 角色名:好感度 🏁 flag名
8. 重要：玩家角色设定已由前端完成（名字=${playerAttrs.name}），不要询问玩家名字或性格设定，直接开始故事
9. 第一次输出直接生成「返校日·重逢」开场场景，不要询问任何前置问题
10. 每次输出末尾必须包含有效的选项列表`;

      messages.push({ role: 'system', content: systemPrompt });

      // Send starting signal
      narrativeContent.innerHTML = '<p style="color:#7b7ba8">故事即将开始…</p>';

      try {
        const firstResponse = await callLLM(messages);
        messages.push({ role: 'assistant', content: firstResponse });
        renderResponse(firstResponse);
        addLog('故事开始');
      } catch (e) {
        narrativeContent.innerHTML = '<div class="error-box">API 连接失败: ' + escapeHtml(e.message) + '</div>' +
          '<p style="color:#7b7ba8;margin-top:12px">请检查 API Key 和网络连接。</p>' +
          '<button class="retry-btn" onclick="window.location.reload()">重新加载</button>';
        choicesList.innerHTML = '';
      }
    }

    // initGame() is called only when user clicks "开始故事"
    // (removed auto-call to prevent double initialization)
  </script>
</body>
