<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>夏日的回音 — AI Visual Novel</title>
  <style>
    /* ===== Reset & Base ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; background: #000; color: #fff; user-select: none; }

    /* ===== 开始画面（覆盖层） ===== */
    #startOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      animation: fadeIn 0.8s ease-out; color: #fff;
    }
    #startOverlay .inner { text-align: center; max-width: 420px; padding: 20px; animation: fadeInUp 1s ease-out; }
    #startOverlay .sub { font-size: 13px; letter-spacing: 6px; color: rgba(200,190,255,.6); margin-bottom: 12px; }
    #startOverlay .title {
      font-size: 44px; font-weight: 700; letter-spacing: 12px;
      background: linear-gradient(135deg,#e8d5ff,#8ec5fc,#e0c3fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    #startOverlay .desc { font-size: 12px; color: rgba(255,255,255,.4); letter-spacing: 3px; margin-bottom: 30px; line-height: 1.8; }
    #startOverlay label { display: block; font-size: 11px; color: rgba(200,180,255,.5); letter-spacing: 2px; margin-bottom: 6px; text-align: left; }
    #startOverlay input {
      width: 100%; padding: 10px 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15);
      border-radius: 6px; color: #fff; font-size: 15px; font-family: inherit; letter-spacing: 2px;
      outline: none; text-align: center; margin-bottom: 16px;
    }
    #startOverlay input:focus { border-color: rgba(200,180,255,.4); }
    .personality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; }
    .pers-opt {
      padding: 10px 8px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px; cursor: pointer; text-align: center; transition: all .2s;
      font-size: 13px; letter-spacing: 1px; color: rgba(255,255,255,.7);
    }
    .pers-opt:hover { background: rgba(255,255,255,.1); border-color: rgba(200,180,255,.3); }
    .pers-opt.selected { background: rgba(200,180,255,.12); border-color: rgba(200,180,255,.5); }
    .pers-opt .emoji { font-size: 18px; display: block; margin-bottom: 2px; }
    .btn-start {
      width: 100%; padding: 12px 0; background: rgba(200,180,255,.15); border: 1px solid rgba(200,180,255,.3);
      border-radius: 6px; color: #fff; font-size: 15px; letter-spacing: 6px; cursor: pointer;
      font-family: inherit; transition: all .3s;
    }
    .btn-start:hover { background: rgba(200,180,255,.25); }

    /* ===== 游戏主界面 ===== */
    #gameScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: none; /* shown after startGame */
    }

    /* 背景层 */
    .bg-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
    }
    #bgImage {
      width: 100%; height: 100%; object-fit: cover;
      transition: opacity 1.2s ease;
    }
    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    /* 人物立绘层 */
    .character-layer {
      position: absolute; bottom: 28%; left: 50%; transform: translateX(-50%);
      z-index: 2; pointer-events: none;
    }
    #spriteImage {
      max-height: 62vh; width: auto;
      opacity: 0; transition: opacity 0.8s ease;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.4));
    }
    #spriteImage.visible { opacity: 1; }

    /* 文本框 - 底部覆盖 */
    .text-layer {
      position: absolute; bottom: 0; left: 0; width: 100%;
      z-index: 5; pointer-events: none;
    }
    .text-window {
      position: relative; margin: 0 auto; max-width: 860px;
      padding: 18px 28px 28px; pointer-events: auto;
    }
    .text-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.88) 100%);
      border-radius: 12px 12px 0 0; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.06);
      border-bottom: none;
    }
    .text-inner { position: relative; z-index: 1; }
    .text-name {
      font-size: 15px; font-weight: 600; letter-spacing: 2px;
      color: #c8b4ff; margin-bottom: 6px; display: none;
    }
    .text-name.visible { display: block; }
    .text-body {
      font-size: 15px; line-height: 1.8; color: rgba(255,255,255,.88);
      min-height: 4.2em; max-height: 8em; overflow: hidden;
      position: relative;
    }
    .text-body p { margin-bottom: 0.4em; }
    .text-body .scene-title {
      font-size: 13px; color: rgba(200,180,255,.6); letter-spacing: 3px;
      margin-bottom: 8px; display: block;
    }
    .text-next {
      text-align: right; font-size: 12px; color: rgba(200,180,255,.4);
      letter-spacing: 2px; margin-top: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }

    /* 点击翻页区域 */
    .click-area {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3; cursor: pointer;
    }

    /* 选项覆盖层 */
    .choices-overlay {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      z-index: 10; max-width: 600px; width: 90%;
      display: none; flex-direction: column; gap: 8px;
    }
    .choices-overlay.visible { display: flex; }
    .choice-btn {
      background: rgba(30,30,46,0.85); border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px; color: #d4d4ea; padding: 12px 18px;
      text-align: left; cursor: pointer; font-size: 14px;
      font-family: inherit; line-height: 1.5; transition: all 0.2s;
      backdrop-filter: blur(6px);
    }
    .choice-btn:hover { border-color: #6c5ce7; background: rgba(108,92,231,0.2); transform: translateX(4px); }
    .choice-hint { display: block; font-size: 11px; color: rgba(200,180,255,.4); margin-top: 2px; letter-spacing: 1px; }

    /* 加载状态 */
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
    }
    .loading-overlay.visible { display: flex; }
    .loading-spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.1);
      border-top-color: #c8b4ff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: rgba(200,180,255,.6); letter-spacing: 2px; }

    /* 错误 */
    .error-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    }
    .error-overlay.visible { display: flex; }
    .error-box {
      background: rgba(42,26,26,0.9); border: 1px solid #f87171; padding: 16px 24px;
      border-radius: 8px; color: #fca5a5; font-size: 13px; max-width: 400px; text-align: center; line-height: 1.6;
    }
    .btn-retry {
      background: rgba(200,180,255,.15); border: 1px solid rgba(200,180,255,.3);
      border-radius: 6px; color: #fff; padding: 10px 28px; cursor: pointer;
      font-size: 13px; letter-spacing: 3px; font-family: inherit;
    }
    .btn-retry:hover { background: rgba(200,180,255,.25); }

    /* 自定义输入 (hidden by default, shown via setting) */
    .custom-input-area {
      position: fixed; bottom: 80px; right: 20px; z-index: 8;
      display: none;
    }
    #toggleCustomBtn {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      border-radius: 50%; width: 36px; height: 36px;
      color: rgba(255,255,255,.3); cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    #toggleCustomBtn:hover { background: rgba(255,255,255,.1); color: rgba(255,255,255,.6); }

    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<!-- ===== 开始画面 ===== -->
<div id="startOverlay">
  <div class="inner">
    <div class="sub">—— AI Visual Novel ——</div>
    <div class="title">夏日的回音</div>
    <div class="desc">高三毕业的夏天 · 一场没人说出口的约定</div>
    <label>你的名字</label>
    <input type="text" id="playerName" value="陈远" maxlength="8">
    <label>你的性格底色</label>
    <div class="personality-grid">
      <div class="pers-opt" data-val="silent" onclick="selectPers(this)"><span class="emoji">🧊</span>沉默寡言</div>
      <div class="pers-opt" data-val="cheerful" onclick="selectPers(this)"><span class="emoji">☀️</span>活泼开朗</div>
      <div class="pers-opt selected" data-val="gentle" onclick="selectPers(this)"><span class="emoji">🌙</span>温柔体贴</div>
      <div class="pers-opt" data-val="tsundere" onclick="selectPers(this)"><span class="emoji">🔥</span>傲娇毒舌</div>
    </div>
    <button class="btn-start" onclick="startGame()">开始故事 →</button>
  </div>
</div>

<!-- ===== 游戏主界面 ===== -->
<div id="gameScreen">
  <!-- 背景 -->
  <div class="bg-layer">
    <img id="bgImage" src="assets/backgrounds/classroom.svg" alt="背景">
    <div class="bg-overlay"></div>
  </div>

  <!-- 人物立绘 -->
  <div class="character-layer">
    <img id="spriteImage" src="" alt="立绘">
  </div>

  <!-- 点击翻页区域 -->
  <div class="click-area" id="clickArea" onclick="advancePage()"></div>

  <!-- 文本框 -->
  <div class="text-layer">
    <div class="text-window">
      <div class="text-bg"></div>
      <div class="text-inner">
        <div class="text-name" id="textName"></div>
        <div class="text-body" id="textBody"><p style="color:rgba(200,180,255,.4)">故事即将开始…</p></div>
        <div class="text-next" id="textNext">▼ 点击继续</div>
      </div>
    </div>
  </div>

  <!-- 选项覆盖 -->
  <div class="choices-overlay" id="choicesOverlay"></div>

  <!-- 加载中 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">故事正在展开…</div>
  </div>

  <!-- 错误 -->
  <div class="error-overlay" id="errorOverlay">
    <div class="error-box" id="errorText">连接失败</div>
    <button class="btn-retry" onclick="retryGame()">重新加载</button>
  </div>

  <!-- 自定义输入按钮 -->
  <div class="custom-input-area">
    <button id="toggleCustomBtn" onclick="toggleCustomInput()" title="自由输入">✎</button>
  </div>
</div>

<script>
// ======================== 开始画面 ========================
let playerAttrs = { name: '陈远', personality: 'gentle' };

function selectPers(el) {
  document.querySelectorAll('.pers-opt').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  playerAttrs.personality = el.dataset.val;
}

function startGame() {
  const name = document.getElementById('playerName').value.trim() || '陈远';
  playerAttrs.name = name;
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  initGame();
}

document.getElementById('playerName').addEventListener('keydown', e => {
  if (e.key === 'Enter') startGame();
});

// ======================== 配置 ========================
const API_BASE_URL = '/proxy';
const API_KEY = '';
const MODEL = 'deepseek-v4-flash';

// ======================== 故事数据 ========================
const STORY_CONTENT = `# 模板 A：校园青春 · 夏日的回音（活动版）

## 类型标签
青春 / 治愈 / 悬疑 / 纯爱 / 群像

## 一句话简介
高三毕业的那个夏天，你回到了空无一人的母校——不是来告别的，是来赴一场没人说出口的约定。昔日同窗一个接一个回来了，每个人都带着秘密，每个人都有没说出口的话。校园里藏着一个高二那年被掩埋的真相，而这个夏天，所有的线头都会浮出水面。

## 世界观
现代中国，普通小城市。时间：六月底到七月中旬，高考结束后的盛夏。
地点：一所县城高中。暑假的校园空荡荡的，但操场上有人在打球，琴房里有人在弹琴，天台上有人躺着看云——这届毕业生们，用自己的方式留在这个夏天里。

## 核心悬念：「高二那件事」
高二下学期，学校里发生了一起严重的事件。你被卷入其中，差点被开除。但你对此的记忆是模糊的——医生说创伤性记忆抑制，你选择性地遗忘了一些东西。
每个人都记得。每个人都知道一部分真相。但没有人主动告诉你。

## 活动推进机制
游戏以校园活动为节奏：①返校日·重逢 → ②校园大扫除 → ③旧照片展 → ④天台夏夜会 → ⑤社团文化祭 → ⑥星空下的坦白 → ⑦夏日祭·告别`;

const PORTRAIT_CHARACTERS = {
  '林雪': 'linxue', '苏云溪': 'suyunxi', '沈清辞': 'shenqingci',
  '夏知遥': 'xiazhiyao', '江晓渔': 'jiangxiaoyu', '程念慈': 'chengnianci', '叶小满': 'yexiaoman'
};
const EXPRESSION_KEYWORDS = {
  '微笑': 'smile', '浅笑': 'smile', '轻笑': 'smile', '温柔': 'smile',
  '开心': 'happy', '大笑': 'happy', '笑出声': 'happy', '愉快': 'happy',
  '生气': 'angry', '愤怒': 'angry', '怒': 'angry', '冷眼': 'angry', '厉声': 'angry',
  '悲伤': 'sad', '伤心': 'sad', '哭': 'sad', '泪': 'sad', '哽咽': 'sad', '难过': 'sad',
  '惊讶': 'surprised', '震惊': 'surprised', '愣': 'surprised', '怔': 'surprised', '难以置信': 'surprised',
  '脸红': 'blush', '害羞': 'blush', '羞涩': 'blush', '心动': 'blush',
  '冷漠': 'cold', '冷淡': 'cold', '面无表情': 'cold', '冰冷': 'cold', '疏离': 'cold',
};

// ======================== 状态 ========================
const messages = [];
let turnCount = 0;
let currentCharName = null;
let currentCharId = null;
let currentExpression = 'default';
let currentPage = -1;
let currentPages = [];
let awaitingChoice = false;
// 临时输入框
let customInputVisible = false;

// ======================== DOM ========================
const bgImage = document.getElementById('bgImage');
const spriteImage = document.getElementById('spriteImage');
const textBody = document.getElementById('textBody');
const textName = document.getElementById('textName');
const textNext = document.getElementById('textNext');
const clickArea = document.getElementById('clickArea');
const choicesOverlay = document.getElementById('choicesOverlay');
const loadingOverlay = document.getElementById('loadingOverlay');
const errorOverlay = document.getElementById('errorOverlay');
const errorText = document.getElementById('errorText');

// ======================== 帮助函数 ========================
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function detectCharacter(text) {
  for (const [name] of Object.entries(PORTRAIT_CHARACTERS)) {
    if (text.includes(name)) return name;
  }
  return null;
}

function detectExpression(text) {
  for (const [keyword, exp] of Object.entries(EXPRESSION_KEYWORDS)) {
    if (text.includes(keyword)) return exp;
  }
  return null;
}

function updateSprite(charName) {
  const charId = PORTRAIT_CHARACTERS[charName];
  if (!charId) {
    spriteImage.classList.remove('visible');
    currentCharName = null;
    currentCharId = null;
    return;
  }
  const imgPath = 'assets/portraits/' + charId + '/' + currentExpression + '.png';
  spriteImage.src = imgPath;
  spriteImage.onerror = () => {
    spriteImage.classList.remove('visible');
    spriteImage.src = '';
  };
  spriteImage.classList.add('visible');
  currentCharName = charName;
  currentCharId = charId;
  textName.textContent = charName;
  textName.classList.add('visible');
}

// ======================== 分页系统 ========================
function splitIntoPages(text) {
  // 按段落分割
  const paragraphBlocks = [];
  const lines = text.split('\n');

  let currentBlock = '';
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) {
      if (currentBlock) { paragraphBlocks.push(currentBlock.trim()); currentBlock = ''; }
      continue;
    }
    // 选项行 → 停止收集 (支持 1. A. 【数字编号等格式）
    if (/^[\dA-Za-z][\.\)\】\）\:]/.test(trimmed) || /^❤/.test(trimmed) || /^\[GALGAME STATE\]/.test(trimmed) || /^Scene:/.test(trimmed) || /^🏁/.test(trimmed) || /^Progress:/.test(trimmed) || /^Recent:/.test(trimmed) || /^---/.test(trimmed)) {
      if (currentBlock) { paragraphBlocks.push(currentBlock.trim()); currentBlock = ''; }
      continue;
    }
    currentBlock += trimmed + '\n';
  }
  if (currentBlock) paragraphBlocks.push(currentBlock.trim());

  // 提取选项
  const options = [];
  for (const line of lines) {
    const t = line.trim();
    if (/^[\dA-Za-z][\.\)\】\）\:]/.test(t) && !/^---/.test(t)) options.push(t);
  }

  // 合并短段落
  const merged = [];
  let buffer = '';
  for (const block of paragraphBlocks) {
    if (!buffer) { buffer = block; continue; }
    // 如果 buffer 很短或 block 很短，合并
    if (buffer.length + block.length < 300 || block.length < 80) {
      buffer += '\n\n' + block;
    } else {
      merged.push(buffer);
      buffer = block;
    }
  }
  if (buffer) merged.push(buffer);

  return { pages: merged, options };
}

function showPage(index) {
  const pages = currentPages;
  if (index < 0 || index >= pages.length) {
    // 所有页显示完 → 显示选项
    showChoices();
    return;
  }

  awaitingChoice = false;
  const text = pages[index];

  // 检测角色+表情
  const charName = detectCharacter(text);
  if (charName) {
    const expr = detectExpression(text) || 'default';
    currentExpression = expr;
    updateSprite(charName);
  }

  // 渲染文本
  textBody.innerHTML = '';
  const lines = text.split('\n');
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    if (t.startsWith('###')) {
      const span = document.createElement('span');
      span.className = 'scene-title';
      span.textContent = t.replace(/^###\s*/, '');
      textBody.appendChild(span);
    } else if (t.startsWith('>')) {
      const p = document.createElement('p');
      p.textContent = t.replace(/^>\s*/, '');
      p.style.cssText = 'color:rgba(200,180,255,.6);font-style:italic;padding-left:10px;border-left:2px solid rgba(200,180,255,.2);margin:4px 0;';
      textBody.appendChild(p);
    } else {
      const p = document.createElement('p');
      p.textContent = t;
      textBody.appendChild(p);
    }
  }

  // 翻页指示
  const isLast = index >= pages.length - 1;
  textNext.textContent = isLast ? '▼ 查看选择' : '▼ 点击继续';
  currentPage = index;
  choicesOverlay.classList.remove('visible');
}

function advancePage() {
  if (awaitingChoice) return;
  if (customInputVisible) return;

  const next = currentPage + 1;
  if (next >= currentPages.length) {
    showChoices();
  } else {
    showPage(next);
  }
}

// ======================== 选项系统 ========================
function showChoices() {
  awaitingChoice = true;
  textNext.textContent = '';
  choicesOverlay.classList.remove('visible');

  // 从最后一个 AI 回复中提取选项
  const lastMsg = messages.filter(m => m.role === 'assistant').pop();
  if (!lastMsg) return;

  const options = [];
  const lines = lastMsg.content.split('\n');
  for (const line of lines) {
    const t = line.trim();
    if (/^[\dA-Za-z][\.\)\】\）\:]/.test(t) && !/^---/.test(t)) options.push(t);
  }

  choicesOverlay.innerHTML = '';
  if (options.length === 0) {
    // 没有选项 → 显示"继续"和"自由输入"
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = '<span>继续推进剧情</span><span class="choice-hint">继续</span>';
    btn.addEventListener('click', () => selectChoice('继续'));
    choicesOverlay.appendChild(btn);
  } else {
    for (const opt of options) {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      const text = opt.replace(/^[\dA-Za-z][\.\)\】\）\:]\s*/, '').replace(/（.*）$/, '').trim();
      const hint = opt.match(/（(.+)）/);
      btn.innerHTML = '<span>' + escapeHtml(text) + '</span>' +
        (hint ? '<span class="choice-hint">' + escapeHtml(hint[1]) + '</span>' : '');
      btn.addEventListener('click', () => selectChoice(opt));
      choicesOverlay.appendChild(btn);
    }
  }

  // 自由输入入口
  const freeBtn = document.createElement('button');
  freeBtn.className = 'choice-btn';
  freeBtn.innerHTML = '<span>✎ 自由输入</span><span class="choice-hint">自己输入对话或行动</span>';
  freeBtn.addEventListener('click', () => openCustomInput());
  choicesOverlay.appendChild(freeBtn);

  choicesOverlay.classList.add('visible');
}

function selectChoice(text) {
  choicesOverlay.classList.remove('visible');
  sendMessage(text);
}

// ======================== 自定义输入 ========================
function openCustomInput() {
  // 简单的 prompt 方式
  const input = prompt('输入你的对话或行动：');
  if (input && input.trim()) {
    choicesOverlay.classList.remove('visible');
    sendMessage(input.trim());
  } else {
    choicesOverlay.classList.add('visible');
  }
}

function toggleCustomInput() {
  openCustomInput();
}

// ======================== API 调用 ========================
async function callLLM(msgs) {
  const response = await fetch(API_BASE_URL + '/chat/completions', {
    method: 'POST',
    headers: Object.assign(
      { 'Content-Type': 'application/json' },
      API_KEY ? { 'Authorization': 'Bearer ' + API_KEY } : {}
    ),
    body: JSON.stringify({
      model: MODEL,
      messages: msgs,
      temperature: 0.7,
      max_tokens: 1024
    })
  });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error('API错误 ' + response.status + ': ' + (errText.length > 200 ? errText.slice(0, 200) : errText));
  }

  const data = await response.json();
  const content = data.choices?.[0]?.message?.content;
  if (!content) throw new Error('API返回为空');
  return content;
}

// ======================== 发送消息 ========================
async function sendMessage(userText) {
  messages.push({ role: 'user', content: userText });
  turnCount++;

  loadingOverlay.classList.add('visible');

  try {
    const response = await callLLM(messages);
    messages.push({ role: 'assistant', content: response });

    // 分页
    const { pages, options } = splitIntoPages(response);
    currentPages = pages;

    // 检测角色变化
    const charName = detectCharacter(response);
    if (charName) {
      const expr = detectExpression(response) || 'default';
      currentExpression = expr;
      updateSprite(charName);
    }

    loadingOverlay.classList.remove('visible');

    if (pages.length === 0) {
      // 只有选项无叙事
      showChoices();
    } else {
      showPage(0);
    }
  } catch (e) {
    loadingOverlay.classList.remove('visible');
    errorText.textContent = '连接失败：' + e.message;
    errorOverlay.classList.add('visible');
  }
}

function retryGame() {
  errorOverlay.classList.remove('visible');
  window.location.reload();
}

// ======================== 键盘事件 ========================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (errorOverlay.classList.contains('visible')) return;
    if (loadingOverlay.classList.contains('visible')) return;
    if (choicesOverlay.classList.contains('visible')) return;
    if (customInputVisible) return;
    advancePage();
  }
});

// ======================== 初始化 ========================
async function initGame() {
  messages.length = 0;
  turnCount = 0;
  currentPage = -1;
  currentPages = [];
  currentCharName = null;
  currentCharId = null;
  awaitingChoice = false;

  const persName = playerAttrs.personality === 'silent' ? '沉默寡言'
    : playerAttrs.personality === 'cheerful' ? '活泼开朗'
    : playerAttrs.personality === 'gentle' ? '温柔体贴' : '傲娇毒舌';

  const systemPrompt = `你是 AI AVG 游戏引擎。你的角色是旁白 + 所有 NPC + 系统面板。

故事设定：
${STORY_CONTENT}

玩家角色：${playerAttrs.name}，性格：${persName}

角色信息：
- 林雪 — 温柔内敛的班长，你的三年同桌
- 苏云溪 — 开朗活泼的青梅竹马
- 沈清辞 — 沉默寡言的摄影少女
- 夏知遥 — 外冷内热的学生会副会长
- 江晓渔 — 元气跳脱的转学生
- 程念慈 — 实习音乐老师（后期解锁）
- 叶小满 — 神秘学妹（后期解锁）

游戏规则：
1. 每次输出包含：场景叙述（用第二人称语言）
2. 不要询问玩家名字或性格设定，直接开始故事
3. 故事从「返校日·重逢」开始——${playerAttrs.name}在暑假回到母校，在走廊上遇到了林雪
4. 用第二人称"你"叙述，称呼玩家为${playerAttrs.name}
5. 场景标题用 ### 标记
6. **非常重要：选项必须使用数字编号格式，如：1.【选项文本】（提示）** 不要使用 A./B./C. 格式，必须用 1. 2. 3.
7. 选项可以包含倾向性提示，用（温和·观察）这样的括号标注
8. 小说级文学描写，注意氛围和细节`;

  messages.push({ role: 'system', content: systemPrompt });

  loadingOverlay.classList.add('visible');

  try {
    const firstResponse = await callLLM(messages);
    messages.push({ role: 'assistant', content: firstResponse });

    const { pages, options } = splitIntoPages(firstResponse);
    currentPages = pages;

    loadingOverlay.classList.remove('visible');

    if (pages.length === 0) {
      showChoices();
    } else {
      showPage(0);
    }
  } catch (e) {
    loadingOverlay.classList.remove('visible');
    errorText.textContent = '连接失败：' + e.message;
    errorOverlay.classList.add('visible');
  }
}
</script>
