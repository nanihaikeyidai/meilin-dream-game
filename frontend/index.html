<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVG-Skill — 启动</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="card-header">
        <h1>AVG-Skill</h1>
        <p class="subtitle" id="modeHint">选择进入方式</p>
      </div>
      <div class="card-body">
        <div id="apiConfigSection" style="display:none">
          <div class="form-group">
            <label for="baseUrl">Base URL</label>
            <input type="text" id="baseUrl" placeholder="https://api.deepseek.com/v1" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
          </div>
          <div class="form-group">
            <label for="modelName">模型名称</label>
            <input type="text" id="modelName" placeholder="deepseek-chat" autocomplete="off">
          </div>
          <div class="form-actions">
            <button id="saveBtn" class="btn-primary">保存并测试</button>
            <span id="statusMsg" class="status-msg"></span>
          </div>
        </div>
        <p id="browserHint" class="subtitle" style="display:none;margin-bottom:16px">
          服务端已配置 LLM，可直接进入游戏。
        </p>
        <div class="form-actions form-actions-center">
          <button id="gotoGameBtn" class="btn-primary btn-enter">选择剧本并开始</button>
        </div>
        <div class="form-actions form-actions-center" style="margin-top:8px">
          <a href="game.html?template=changan-moon" class="btn-primary btn-secondary" style="text-decoration:none;display:inline-block;padding:10px 20px">快速试玩 · 月下长安</a>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api-config.js"></script>
  <script>
    const isElectron = typeof window.electronAPI !== 'undefined';
    const modeHint = document.getElementById('modeHint');
    const apiConfigSection = document.getElementById('apiConfigSection');
    const browserHint = document.getElementById('browserHint');
    const gotoGameBtn = document.getElementById('gotoGameBtn');

    const baseUrlInput = document.getElementById('baseUrl');
    const apiKeyInput = document.getElementById('apiKey');
    const modelNameInput = document.getElementById('modelName');
    const saveBtn = document.getElementById('saveBtn');
    const statusMsg = document.getElementById('statusMsg');

    let needsClientConfig = false;

    function showStatus(msg, isError) {
      statusMsg.textContent = msg;
      statusMsg.className = 'status-msg' + (isError ? ' error' : ' success');
      setTimeout(() => { statusMsg.textContent = ''; statusMsg.className = 'status-msg'; }, 4000);
    }

    async function loadConfig() {
      try {
        const config = isElectron
          ? await window.electronAPI.apiKey.load()
          : await AvgApiConfig.loadApiConfig();
        baseUrlInput.value = config.baseUrl || 'https://api.deepseek.com/v1';
        apiKeyInput.value = config.apiKey || '';
        modelNameInput.value = config.model || AvgApiConfig.DEFAULT_MODEL;
      } catch (e) {
        showStatus('加载配置失败', true);
      }
    }

    async function saveConfig() {
      const baseUrl = baseUrlInput.value.trim();
      const apiKey = apiKeyInput.value.trim();
      const model = modelNameInput.value.trim() || AvgApiConfig.DEFAULT_MODEL;
      const config = { baseUrl, apiKey, model };
      if (!AvgApiConfig.isConfigComplete(config)) {
        showStatus('请填写 Base URL 与 API Key', true);
        return false;
      }
      saveBtn.disabled = true;
      try {
        if (isElectron) {
          const result = await window.electronAPI.apiKey.save(config);
          if (!result.success) throw new Error('保存失败');
        } else {
          await AvgApiConfig.saveApiConfig(config);
          await AvgApiConfig.testApiConfig(config);
        }
        needsClientConfig = false;
        showStatus('保存成功', false);
        return true;
      } catch (e) {
        showStatus(e.message || '保存出错', true);
        return false;
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function initPage() {
      if (isElectron) {
        modeHint.textContent = 'Electron 模式 — 请配置 LLM API';
        apiConfigSection.style.display = 'block';
        await loadConfig();
        return;
      }

      modeHint.textContent = '浏览器开发模式';
      const setup = await AvgApiConfig.resolveLlmSetup();
      needsClientConfig = setup.mode === 'needs_config';
      if (needsClientConfig) {
        modeHint.textContent = '请先配置 AI 引擎';
        apiConfigSection.style.display = 'block';
        await loadConfig();
      } else {
        browserHint.style.display = 'block';
      }
    }

    if (saveBtn) saveBtn.addEventListener('click', saveConfig);

    gotoGameBtn.addEventListener('click', async () => {
      if (needsClientConfig || isElectron) {
        const ok = await saveConfig();
        if (!ok && (needsClientConfig || isElectron)) return;
        if (isElectron && !AvgApiConfig.isConfigComplete({
          baseUrl: baseUrlInput.value.trim(),
          apiKey: apiKeyInput.value.trim(),
        })) return;
      }
      if (isElectron) {
        window.electronAPI.navigate.to('templates');
      } else {
        location.href = 'templates.html';
      }
    });

    initPage();
  </script>
</body>
</html>
