  </defs>
  <rect width="220" height="340" rx="12" fill="url(#bg)" />
  <rect width="220" height="340" rx="12" fill="url(#glow)" />
  <text x="110" y="80" text-anchor="middle" font-size="60" fill="#e0e0ff" opacity="0.3">💮</text>
  <text x="110" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e0e0ff" opacity="0.7">沈明月</text>
