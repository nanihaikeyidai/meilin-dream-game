  <rect x="50" y="100" width="120" height="140" rx="60" fill="#e0e0ff" opacity="0.12" />
  <rect x="65" y="115" width="90" height="110" rx="45" fill="#e0e0ff" opacity="0.08" />
  <!-- Decorative line -->
  <line x1="30" y1="320" x2="190" y2="320" stroke="#e0e0ff" stroke-width="0.5" opacity="0.3" />
