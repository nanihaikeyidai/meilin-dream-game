<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创建角色</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page character-page">
    <div class="page-header">
      <h1>创建角色</h1>
      <p class="subtitle" id="templateName">正在加载...</p>
    </div>
    <div class="character-card">
      <div class="form-group">
        <label for="charName">角色名字</label>
        <input type="text" id="charName" placeholder="给你的角色起个名字..." maxlength="20">
      </div>
      <div class="form-group">
        <label for="charGender">性别</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="gender" value="女" checked>
            <span>女</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="男">
            <span>男</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="其他">
            <span>其他</span>
          </label>
        </div>
      </div>
      <div class="form-group">
        <label for="charPersonality">性格描述</label>
        <textarea id="charPersonality" rows="3" placeholder="例如：冷静理智、温柔善良、傲娇毒舌..."></textarea>
      </div>
      <div class="form-group">
        <label for="charBackground">背景设定（可选）</label>
        <textarea id="charBackground" rows="3" placeholder="补充角色的背景故事、特殊能力或隐藏秘密..."></textarea>
      </div>
      <div class="form-actions form-actions-center">
        <button id="backBtn" class="btn-primary btn-secondary">返回</button>
        <button id="startBtn" class="btn-primary btn-enter">开始游戏</button>
      </div>
      <div id="preloadStatus" class="status-msg" style="text-align:center;margin-top:14px"></div>
    </div>
  </div>
  <audio id="menuBgmPlayer" preload="auto"></audio>
  <script src="js/template-registry.js"></script>
  <script src="js/api-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/story-preload.js"></script>
  <script src="js/bgm.js"></script>
  <script>
    const templateData = JSON.parse(sessionStorage.getItem('selectedTemplate') || '{}');
    const template = window.AvgTemplates.getTemplate(templateData.id || 'changan-moon');
    const preloadStatus = document.getElementById('preloadStatus');
    const startBtn = document.getElementById('startBtn');
    let menuBgm = null;
    let preloadTimer = null;
    let preloadToken = 0;
    let preloadPromise = null;
    let preloadKey = '';

    function startMenuBgm() {
      menuBgm?.start();
    }

    function stopMenuBgm() {
      menuBgm?.stop();
    }

    function rememberMenuBgm() {
      menuBgm?.remember();
    }

    function bindMenuBgmUnlock() {
      const unlock = () => startMenuBgm();
      document.addEventListener('pointerdown', unlock, { once: true });
      document.addEventListener('keydown', unlock, { once: true });
    }

    menuBgm = window.AvgBgm.createMenuBgm();
    menuBgm.bindDom(document.getElementById('menuBgmPlayer'));
    startMenuBgm();
    bindMenuBgmUnlock();

    function setPreloadStatus(message, isError) {
      preloadStatus.textContent = message || '';
      preloadStatus.className = 'status-msg' + (isError ? ' error' : message ? ' success' : '');
    }

    function collectCharacter() {
      return {
        name: document.getElementById('charName').value.trim(),
        gender: document.querySelector('input[name="gender"]:checked').value,
        personality: document.getElementById('charPersonality').value.trim(),
        background: document.getElementById('charBackground').value.trim(),
      };
    }

    function scheduleInitialPreload() {
      clearTimeout(preloadTimer);
      preloadTimer = setTimeout(startInitialPreload, 700);
    }

    async function startInitialPreload() {
      const character = collectCharacter();
      if (!character.name) {
        setPreloadStatus('填写角色名字后，会提前生成开场剧情', false);
        return null;
      }

      const normalized = window.AvgStoryPreload.normalizeCharacter(template, character);
      const key = window.AvgStoryPreload.buildCharacterKey(template.id, normalized);
      if (key === preloadKey && preloadPromise) return preloadPromise;
      preloadKey = key;

      const token = ++preloadToken;
      const cached = window.AvgStoryPreload.getMatching(template.id, normalized);
      if (cached) {
        setPreloadStatus('开场剧情已预载，开始游戏可直接进入', false);
        return cached;
      }

      setPreloadStatus('正在提前生成开场剧情…', false);
      preloadPromise = window.AvgStoryPreload.preloadInitialStory(template, normalized)
        .then((payload) => {
          if (token === preloadToken) {
            setPreloadStatus('开场剧情已预载，开始游戏可直接进入', false);
          }
          return payload;
        })
        .catch((err) => {
          if (token === preloadToken) {
            setPreloadStatus('预载失败，进入游戏后将正常生成：' + (err.message || err), true);
          }
          return null;
        });
      return preloadPromise;
    }

    document.getElementById('templateName').textContent = templateData.title || template.title || '未知剧本';
    document.getElementById('charName').value = template.defaultPlayerName || '';
    scheduleInitialPreload();

    document.getElementById('backBtn').addEventListener('click', () => {
      rememberMenuBgm();
      if (window.electronAPI?.navigate?.to) {
        window.electronAPI.navigate.to('templates');
      } else {
        location.href = 'templates.html';
      }
    });

    startBtn.addEventListener('click', async () => {
      const name = document.getElementById('charName').value.trim();
      if (!name) {
        alert('请输入角色名字');
        return;
      }

      const character = collectCharacter();
      sessionStorage.setItem('character', JSON.stringify(character));
      startBtn.disabled = true;
      startBtn.textContent = '准备剧情中…';
      await startInitialPreload();
      stopMenuBgm();
      if (window.electronAPI?.navigate?.to) {
        window.electronAPI.navigate.to('game');
      } else {
        location.href = 'game.html';
      }
    });

    document.getElementById('charName').addEventListener('input', scheduleInitialPreload);
    document.getElementById('charPersonality').addEventListener('input', scheduleInitialPreload);
    document.getElementById('charBackground').addEventListener('input', scheduleInitialPreload);
    document.querySelectorAll('input[name="gender"]').forEach((el) => {
      el.addEventListener('change', scheduleInitialPreload);
    });
  </script>
</body>
</html>
